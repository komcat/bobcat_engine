; Application Settings
; This file contains configurable application parameters.
; For local overrides, create applicationSettings.local.ini in this directory.

[ChainExecution]
; Auto-continue timeout in seconds for chain execution dialog
; When a recipe completes and chain execution triggers the next recipe,
; this is how long the dialog waits before automatically continuing.
AutoContinueSeconds=3

[Scanning]
; Default timeout for scan operations (milliseconds)
DefaultScanTimeoutMs=60000

[UI]
; Maximum log lines to keep in execution log
MaxLogLines=200
